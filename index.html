<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#176b57">
<title>日本旅遊日文衝刺｜150 詞＋40 句</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--muted:#707070;--line:#e2ded5;--accent:#176b57;--soft:#e8f2ee}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;margin:0;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);padding:18px;border-bottom:1px solid var(--line);z-index:2}
.wrap{max-width:980px;margin:auto}h1{margin:0 0 5px;font-size:27px}.sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.controls{display:grid;gap:8px}input,select{font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;width:100%}
main{padding:14px}.stats{font-size:13px;color:var(--muted);margin:4px 2px 12px}.grid{display:grid;gap:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 1px 7px rgba(0,0,0,.035)}
.row{display:flex;justify-content:space-between;gap:12px}.jp{font-size:25px;font-weight:750;line-height:1.35}.kana{color:var(--accent);margin-top:3px}.romaji{color:var(--muted);font-size:13px;margin-top:2px}.zh{margin-top:9px}.tag{display:inline-block;font-size:11px;color:var(--muted);margin-top:10px;padding:3px 7px;border:1px solid var(--line);border-radius:999px}
.play{border:0;border-radius:12px;background:var(--accent);color:#fff;padding:9px 12px;height:43px;min-width:48px;font-size:17px;cursor:pointer}
.tip{background:var(--soft);color:#315b50;padding:9px 11px;border-radius:12px;font-size:12px;margin-top:9px}
@media(min-width:700px){.controls{grid-template-columns:2fr 1fr 1fr}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="controls">
<input id="q" type="search" placeholder="搜尋：行李、にもつ、nimotsu、購物…">
<select id="type"><option value="all">全部</option><option value="word">單字</option><option value="sentence">句子</option></select>
<select id="cat"><option value="all">全部分類</option></select>
</div>
<div class="tip">▶︎ 使用 iPhone / 瀏覽器內建的日文語音播放。語音品質取決於裝置的日文語音；建議 iPhone 使用 Safari。</div>
</div></header>
<main class="wrap"><div id="stats" class="stats"></div><div id="list" class="grid"></div></main>

const S = "一定要會|すみません。|すみません|Sumimasen.|不好意思／請問。\n一定要會|ありがとうございます。|ありがとうございます|Arigatō gozaimasu.|謝謝。\n一定要會|これ、お願いします。|これ、おねがいします|Kore, onegaishimasu.|我要這個／麻煩這個。\n一定要會|大丈夫です。|だいじょうぶです|Daijōbu desu.|可以／不用了／沒關係。\n一定要會|これは何ですか？|これはなんですか|Kore wa nan desu ka?|這是什麼？\n一定要會|〜はどこですか？|〜はどこですか|~ wa doko desu ka?|～在哪裡？\n一定要會|〜ありますか？|〜ありますか|~ arimasu ka?|有～嗎？\n一定要會|〜てもいいですか？|〜てもいいですか|~te mo ii desu ka?|可以～嗎？\n一定要會|もう一度お願いします。|もういちどおねがいします|Mō ichido onegaishimasu.|麻煩再說一次。\n一定要會|ゆっくりお願いします。|ゆっくりおねがいします|Yukkuri onegaishimasu.|麻煩說慢一點。\n餐廳|一人です。|ひとりです|Hitori desu.|一位。\n餐廳|これ、一つお願いします。|これ、ひとつおねがいします|Kore, hitotsu onegaishimasu.|這個一份。\n餐廳|おすすめは何ですか？|おすすめはなんですか|Osusume wa nan desu ka?|推薦什麼？\n餐廳|お水お願いします。|おみずおねがいします|Omizu onegaishimasu.|麻煩給我水。\n餐廳|店内で。|てんないで|Tennai de.|內用。\n餐廳|持ち帰りで。|もちかえりで|Mochikaeri de.|外帶。\n餐廳|お会計お願いします。|おかいけいおねがいします|Okaikei onegaishimasu.|麻煩結帳。\n餐廳|カード使えますか？|カードつかえますか|Kādo tsukaemasu ka?|可以刷卡嗎？\n購物|これ、ありますか？|これ、ありますか|Kore, arimasu ka?|有這個嗎？\n購物|Mサイズありますか？|エムサイズありますか|Emu saizu arimasu ka?|有 M 號嗎？\n購物|別の色はありますか？|べつのいろはありますか|Betsu no iro wa arimasu ka?|有其他顏色嗎？\n購物|試着してもいいですか？|しちゃくしてもいいですか|Shichaku shite mo ii desu ka?|可以試穿嗎？\n購物|新しいものはありますか？|あたらしいものはありますか|Atarashii mono wa arimasu ka?|有新的嗎？\n購物|免税できますか？|めんぜいできますか|Menzei dekimasu ka?|可以免稅嗎？\n購物|これにします。|これにします|Kore ni shimasu.|我要這個。\n購物|ちょっと考えます。|ちょっとかんがえます|Chotto kangaemasu.|我再考慮一下。\n交通|この電車、京都に行きますか？|このでんしゃ、きょうとにいきますか|Kono densha, Kyōto ni ikimasu ka?|這班電車會到京都嗎？\n交通|ここで乗り換えですか？|ここでのりかえですか|Koko de norikae desu ka?|在這裡轉車嗎？\n交通|何番線ですか？|なんばんせんですか|Nan-bansen desu ka?|第幾月台？\n交通|駅はどこですか？|えきはどこですか|Eki wa doko desu ka?|車站在哪？\n交通|この電車で大丈夫ですか？|このでんしゃでだいじょうぶですか|Kono densha de daijōbu desu ka?|搭這班車對嗎？\n交通|次ですか？|つぎですか|Tsugi desu ka?|是下一站嗎？\n飯店景點|予約しています。|よやくしています|Yoyaku shiteimasu.|我有預約。\n飯店景點|チェックインお願いします。|チェックインおねがいします|Chekku-in onegaishimasu.|我要辦入住。\n飯店景點|荷物、預けてもいいですか？|にもつ、あずけてもいいですか|Nimotsu, azukete mo ii desu ka?|可以寄放行李嗎？\n飯店景點|荷物を取りに来ました。|にもつをとりにきました|Nimotsu o tori ni kimashita.|我來拿行李。\n飯店景點|何時までですか？|なんじまでですか|Nanji made desu ka? const parse=(s,t)=>s.trim().split('\n').map(x=>{const [cat,jp,kana,romaji,zh]=x.split('|');return{type:t,cat,jp,kana,romaji,zh}});

const q=document.querySelector('#q'),type=document.querySelector('#type'),cat=document.querySelector('#cat'),list=document.querySelector('#list'),stats=document.querySelector('#stats');
[...new Set(data.map(x=>x.cat))].forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;cat.appendChild(o)});
function speak(t){
 if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音播放');return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t.replaceAll('〜',''));
 u.lang='ja-JP';u.rate=.82;u.pitch=1;
 const voices=speechSynthesis.getVoices();
 const v=voices.find(v=>v.lang==='ja-JP')||voices.find(v=>v.lang.startsWith('ja'));
 if(v)u.voice=v;
 speechSynthesis.speak(u);
}
function render(){
 const s=q.value.trim().toLowerCase();
 const a=data.filter(x=>(type.value==='all'||x.type===type.value)&&(cat.value==='all'||x.cat===cat.value)&&[x.jp,x.kana,x.romaji,x.zh,x.cat].join(' ').toLowerCase().includes(s));
 stats.textContent=`顯示 ${a.length} / ${data.length} 項`;
 list.innerHTML='';
 for(const x of a){
  const card=document.createElement('article');card.className='card';
  card.innerHTML=`<div class="row"><div><div class="jp">${x.jp}</div><div class="kana">${x.kana}</div><div class="romaji">${x.romaji}</div></div><button class="play" aria-label="播放日文">▶︎</button></div><div class="zh">${x.zh}</div><div class="tag">${x.type==='word'?'單字':'句子'}・${x.cat}</div>`;
  card.querySelector('.play').onclick=()=>speak(x.jp);
  list.appendChild(card);
 }
}
q.oninput=render;type.onchange=render;cat.onchange=render;
render();
</script>
